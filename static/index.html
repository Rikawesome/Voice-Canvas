<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>VoiceCanvas | Manga Studio</title>
<style>

:root{
    --bg:#080b14;
    --bg2:#0d1324;
    --panel:rgba(18,25,44,.92);
    --panel2:rgba(24,34,58,.94);
    --glass:rgba(255,255,255,.05);
    --line:rgba(170,194,255,.15);
    --text:#f3f7ff;
    --muted:#9aa9c5;
    --cyan:#65e4ff;
    --gold:#ffd166;
    --coral:#ff7a59;
    --mint:#6df2c2;
    --radius:24px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Inter,system-ui,sans-serif;
    background: radial-gradient(circle at top left, rgba(255,122,89,.15), transparent 25%),
                radial-gradient(circle at top right, rgba(101,228,255,.12), transparent 25%),
                linear-gradient(180deg, #10182d 0%, #070b14 60%, #05070d 100%);
    color:var(--text);
}

.app-shell{
    width:100%;
    height:100dvh;
    display:grid;
    grid-template-columns:320px 1fr;
    overflow:hidden;
}

/* =========================
SIDEBAR
========================= */

.side-rail{
    background:rgba(7,11,20,.96);
    border-right:1px solid var(--line);
    padding:24px 18px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.logo-kicker{
    color:var(--gold);
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:.72rem;
    font-weight:800;
}

.logo{
    margin-top:4px;
    font-size:2rem;
    font-weight:900;
    letter-spacing:-.05em;
}

.logo-sub{
    margin-top:10px;
    line-height:1.55;
    color:var(--muted);
    font-size:.92rem;
}

.sidebar-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
}

.sidebar-label{
    color:var(--muted);
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.14em;
    margin-bottom:12px;
    font-weight:800;
}

.mode-btn{
    width:100%;
    padding:14px;
    margin-bottom:10px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    background:rgba(255,255,255,.05);
    color:var(--text);
    font-weight:700;
    text-align:left;
    transition:.18s;
}

.mode-btn:hover{
    transform:translateY(-1px);
    background:rgba(255,255,255,.08);
}

.mode-btn.active{
    background:linear-gradient(135deg, rgba(255,122,89,.28), rgba(101,228,255,.18));
    border:1px solid rgba(255,255,255,.08);
}

#mode-indicator{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:8px 12px;
    border-radius:999px;
    background:rgba(255,209,102,.12);
    color:var(--gold);
    border:1px solid rgba(255,209,102,.18);
    font-size:.75rem;
    font-weight:800;
    letter-spacing:.12em;
}

.sidebar-action{
    width:100%;
    margin-top:12px;
    padding:12px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    color:var(--text);
    background:rgba(255,255,255,.06);
    font-weight:700;
}

/* =========================
MAIN
========================= */

.workspace{
    display:grid;
    grid-template-rows:auto auto 1fr auto;
    min-width:0;
    min-height:0;
}

.workspace-header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--line);
    background:rgba(7,11,20,.94);
    backdrop-filter:blur(16px);
}

.workspace-title{
    font-size:1.5rem;
    font-weight:900;
    letter-spacing:-.04em;
}

.workspace-sub{
    margin-top:6px;
    color:var(--muted);
    line-height:1.55;
    font-size:.92rem;
}

/* =========================
MOBILE
========================= */

.mobile-topbar{
    display:none;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    background:rgba(7,11,20,.96);
}

.mobile-menu-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.06);
    color:white;
    cursor:pointer;
    font-size:1.1rem;
}

.mobile-brand{
    flex:1;
}

.mobile-kicker{
    color:var(--gold);
    letter-spacing:.16em;
    text-transform:uppercase;
    font-size:.62rem;
    font-weight:800;
}

.mobile-title{
    margin-top:2px;
    font-size:1rem;
    font-weight:900;
}

.mobile-topbar-btn{
    padding:10px 12px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    color:white;
    cursor:pointer;
    font-size:.72rem;
    font-weight:700;
}

.mobile-mode-row{
    display:none;
    gap:8px;
    overflow-x:auto;
    padding:10px 12px;
    background:rgba(7,11,20,.96);
    border-bottom:1px solid var(--line);
}

.mobile-mode-btn{
    white-space:nowrap;
    padding:10px 14px;
    border:none;
    border-radius:999px;
    background:rgba(255,255,255,.05);
    color:white;
    cursor:pointer;
    font-size:.78rem;
    font-weight:700;
}

.mobile-mode-btn.active{
    background:linear-gradient(135deg, rgba(255,122,89,.28), rgba(101,228,255,.18));
}

/* =========================
MESSAGES
========================= */

#messages{
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:16px;
    min-height:0;
    scroll-behavior:smooth;
}

.message{
    max-width:84%;
    padding:14px 16px;
    border-radius:22px;
    line-height:1.55;
    border:1px solid rgba(255,255,255,.06);
    white-space:pre-wrap;
}

.user{
    align-self:flex-end;
    background:linear-gradient(135deg, var(--coral), var(--gold));
    color:#25140d;
    font-weight:700;
    border-bottom-right-radius:8px;
}

.assistant{
    align-self:flex-start;
    background:linear-gradient(180deg, rgba(20,30,52,.96), rgba(10,16,30,.98));
    border-bottom-left-radius:8px;
}

/* =========================
MANGA PAGE & PANELS
========================= */

.manga-page-card{
    width:min(100%,920px);
    align-self:center;
    padding:10px;
    border-radius:28px;
    background:linear-gradient(180deg, rgba(18,27,48,.98), rgba(8,14,26,.98));
    border:1px solid rgba(255,255,255,.08);
}

.manga-page-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.manga-page-title{
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:.1em;
    font-size:.75rem;
    font-weight:900;
}

.manga-page-hint{
    color:var(--muted);
    font-size:.76rem;
}

.manga-page-preview{
    width:100%;
    background:black;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
}

.manga-page-preview img{
    width:100%;
    display:block;
}

.panel-gallery{
    width:min(100%,920px);
    align-self:center;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.panel-gallery-title{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:.82rem;
}

.panel-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.panel-card{
    width:100%;
    border:none;
    padding:10px;
    border-radius:22px;
    cursor:pointer;
    background:linear-gradient(180deg, rgba(18,27,48,.96), rgba(8,14,26,.98));
    border:1px solid rgba(255,255,255,.08);
    color:white;
}

.panel-frame{
    overflow:hidden;
    border-radius:16px;
    background:black;
    position:relative;
}

.panel-frame img{
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    display:block;
}

/* =========================
MANGA-ACCURATE SPEECH BUBBLES
========================= */

.bubble-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.speech-bubble{
    position:absolute;
    min-width:80px;
    max-width:38%;
    pointer-events:auto;
    cursor:move;
    z-index:100;
}

/* Speech bubble shapes using SVG backgrounds */
.speech-bubble[data-style="speech"]{
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120"><path d="M10,10 Q10,5 20,5 L180,5 Q190,5 190,15 L190,95 Q190,105 180,105 L80,105 L50,135 L55,105 L20,105 Q10,105 10,95 Z" fill="white" stroke="black" stroke-width="2.5"/></svg>');
    background-repeat:no-repeat;
    background-size:100% 100%;
    background-color:transparent;
    padding:18px 16px 16px 20px;
    min-height:70px;
}

.speech-bubble[data-style="shout"]{
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120"><path d="M15,15 L30,5 L55,12 L85,5 L110,15 L140,8 L165,18 L185,35 L192,58 L185,85 L195,105 L175,115 L150,108 L120,118 L90,112 L60,118 L30,110 L10,95 L5,70 L8,45 Z" fill="white" stroke="black" stroke-width="2.5"/><path d="M100,25 L100,75 M85,55 L115,55" stroke="black" stroke-width="3"/></svg>');
    background-repeat:no-repeat;
    background-size:100% 100%;
    padding:20px 20px 18px 20px;
    min-height:70px;
}

.speech-bubble[data-style="thought"]{
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100"><ellipse cx="100" cy="45" rx="88" ry="40" fill="white" stroke="black" stroke-width="2.5"/><circle cx="45" cy="78" r="8" fill="white" stroke="black" stroke-width="2"/><circle cx="30" cy="92" r="5" fill="white" stroke="black" stroke-width="1.5"/><circle cx="20" cy="98" r="3" fill="white" stroke="black" stroke-width="1.5"/></svg>');
    background-repeat:no-repeat;
    background-size:100% 100%;
    padding:16px 20px 12px 20px;
    min-height:60px;
}

.speech-bubble[data-style="caption"]{
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 50"><rect x="5" y="5" width="290" height="40" rx="4" fill="%231a1a2e" stroke="black" stroke-width="2"/></svg>');
    background-repeat:no-repeat;
    background-size:100% 100%;
    padding:10px 16px;
    min-height:40px;
}

.speech-bubble[data-style="caption"] .bubble-text{
    color:white;
    font-family:"Arial Narrow","Franklin Gothic Medium",Arial,sans-serif;
    font-size:.7rem;
    letter-spacing:.1em;
    text-transform:uppercase;
}

.speech-bubble[data-style="sfx"]{
    background:transparent;
    text-shadow:2px 2px 0 #fff,4px 4px 0 #000;
    font-family:Impact,"Arial Black",sans-serif;
    font-size:1.4rem;
    font-weight:900;
    letter-spacing:.05em;
    min-height:auto;
    padding:8px;
}

/* Bubble text styling */
.bubble-text{
    font-family:"Comic Neue","Comic Sans MS","Segoe UI",Arial,sans-serif;
    font-size:.85rem;
    line-height:1.35;
    text-align:center;
    word-break:break-word;
    color:#111;
    font-weight:600;
    position:relative;
    z-index:2;
}

.speech-bubble[data-style="shout"] .bubble-text{
    font-size:1rem;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.02em;
}

.speech-bubble[data-style="thought"] .bubble-text{
    font-style:italic;
    font-family:"Segoe UI","Comic Sans MS",Arial,sans-serif;
}

/* Bubble controls */
.bubble-toolbar{
    position:absolute;
    top:-34px;
    left:0;
    display:none;
    align-items:center;
    gap:6px;
    padding:4px 6px;
    border-radius:999px;
    background:rgba(8,11,18,.92);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 10px 24px rgba(0,0,0,.28);
}

.speech-bubble.editing .bubble-toolbar,
.speech-bubble.dragging .bubble-toolbar,
.speech-bubble.move-ready .bubble-toolbar{
    display:flex;
}

.bubble-tool{
    border:none;
    min-width:26px;
    height:26px;
    padding:0 8px;
    border-radius:999px;
    background:rgba(255,255,255,.08);
    color:#f8fafc;
    font-size:.68rem;
    font-weight:800;
    cursor:pointer;
}

.bubble-handle{
    position:absolute;
    right:-8px;
    bottom:-8px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--cyan);
    border:2px solid #08111c;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    cursor:nwse-resize;
    display:none;
}

.speech-bubble.editing .bubble-handle,
.speech-bubble.dragging .bubble-handle,
.speech-bubble.move-ready .bubble-handle{
    display:block;
}

.speech-bubble.move-ready{
    outline:2px dashed rgba(101,228,255,.85);
    outline-offset:2px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
}

.panel-index{
    color:var(--gold);
    font-size:.74rem;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.1em;
}

.panel-speaker{
    background:rgba(255,255,255,.06);
    padding:4px 8px;
    border-radius:999px;
    color:var(--mint);
    font-size:.72rem;
}

/* =========================
INPUT AREA
========================= */

.input-area{
    padding:14px 18px 18px;
    border-top:1px solid var(--line);
    background:rgba(7,11,20,.94);
    backdrop-filter:blur(16px);
}

.composer-mode-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    overflow-x:auto;
}

.composer-mode-btn{
    white-space:nowrap;
    padding:9px 12px;
    border:none;
    border-radius:999px;
    background:rgba(255,255,255,.05);
    color:white;
    cursor:pointer;
    font-size:.76rem;
    font-weight:700;
}

.composer-mode-btn.active{
    background:linear-gradient(135deg, rgba(255,122,89,.28), rgba(101,228,255,.18));
}

.composer-shell{
    padding:10px;
    border-radius:24px;
    background:rgba(12,19,34,.98);
    border:1px solid var(--line);
}

.input-row{
    display:grid;
    grid-template-columns:auto auto 1fr auto;
    gap:8px;
    align-items:center;
}

.attach-btn,
.action-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    color:white;
    font-size:1rem;
}

.attach-btn{
    background:rgba(255,255,255,.06);
}

.action-btn{
    background:linear-gradient(135deg, var(--coral), var(--gold));
    color:#25140d;
    font-weight:900;
}

.text-stack{
    min-height:46px;
    display:flex;
    align-items:center;
    padding:0 14px;
    border-radius:18px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.06);
}

#user-input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    font-size:15px;
}

#user-input::placeholder{
    color:var(--muted);
}

.attachment-chip{
    display:none;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
    padding:10px;
    border-radius:18px;
    background:linear-gradient(135deg, rgba(101,228,255,.14), rgba(109,242,194,.08));
    border:1px solid rgba(255,255,255,.08);
}

.attachment-chip.visible{
    display:flex;
}

.attachment-thumb{
    width:54px;
    height:54px;
    border-radius:14px;
    object-fit:cover;
}

.attachment-copy{
    flex:1;
}

.attachment-title{
    font-size:.9rem;
    font-weight:800;
}

.attachment-subtitle{
    margin-top:4px;
    color:var(--muted);
    font-size:.75rem;
}

.attachment-remove{
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    color:white;
    cursor:pointer;
}

/* =========================
LIGHTBOX
========================= */

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.96);
    align-items:center;
    justify-content:center;
    padding:16px;
}

.lightbox.active{
    display:flex;
}

.lightbox img{
    max-width:100%;
    max-height:88dvh;
    object-fit:contain;
    border-radius:14px;
}

.lightbox-close,
.lightbox-nav{
    position:absolute;
    border:none;
    cursor:pointer;
    background:rgba(255,255,255,.12);
    color:white;
    backdrop-filter:blur(10px);
}

.lightbox-close{
    top:16px;
    right:16px;
    width:44px;
    height:44px;
    border-radius:50%;
    font-size:1.4rem;
}

.lightbox-nav{
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:60px;
    border-radius:16px;
    font-size:1.8rem;
}

.lightbox-prev{
    left:12px;
}

.lightbox-next{
    right:12px;
}

.lightbox-counter{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 12px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:.8rem;
}

/* =========================
MOBILE RESPONSIVE
========================= */

@media(max-width:960px){
    .app-shell{
        grid-template-columns:1fr;
    }
    .side-rail{
        position:fixed;
        left:0;
        top:0;
        width:min(320px,84vw);
        height:100dvh;
        z-index:3000;
        transform:translateX(-105%);
        transition:.24s;
        box-shadow:20px 0 60px rgba(0,0,0,.65);
    }
    body.mobile-menu-open .side-rail{
        transform:translateX(0);
    }
    body.mobile-menu-open::after{
        content:"";
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.68);
        z-index:2000;
    }
    .mobile-topbar{
        display:flex;
    }
    .mobile-mode-row{
        display:flex;
    }
    .workspace-header{
        display:none;
    }
    #messages{
        padding:14px 12px;
    }
    .message{
        max-width:94%;
    }
    .panel-grid{
        grid-template-columns:1fr;
    }
    .input-area{
        padding:10px 12px calc(12px + env(safe-area-inset-bottom));
    }
    .composer-mode-row{
        display:none;
    }
    .lightbox-nav{
        width:42px;
        height:54px;
    }
}

@media(max-width:390px){
    .speech-bubble{
        max-width:58%;
    }
    .bubble-text{
        font-size:.75rem;
    }
    .speech-bubble[data-style="shout"] .bubble-text{
        font-size:.85rem;
    }
}
</style>
</head>
<body>

<div class="app-shell">
    <aside class="side-rail">
        <div>
            <div class="logo-kicker">Manga Studio</div>
            <div class="logo">VoiceCanvas</div>
            <div class="logo-sub">Gist ideas. Workshop scenes. Generate manga pages.</div>
        </div>
        <div class="sidebar-card">
            <div class="sidebar-label">Modes</div>
            <button id="chat-mode-btn" class="mode-btn active">Gist Mode</button>
            <button id="workshop-mode-btn" class="mode-btn">Workshop</button>
            <button id="scene-mode-btn" class="mode-btn">Production</button>
        </div>
        <div class="sidebar-card">
            <div class="sidebar-label">Session</div>
            <div id="mode-indicator">GIST</div>
            <button id="new-session-btn" class="sidebar-action">Reset Session</button>
            <button id="test-manga-ui-btn" class="sidebar-action">Test Manga UI</button>
        </div>
    </aside>

    <main class="workspace">
        <div class="mobile-topbar">
            <button id="mobile-menu-btn" class="mobile-menu-btn">☰</button>
            <div class="mobile-brand">
                <div class="mobile-kicker">Manga Studio</div>
                <div class="mobile-title">VoiceCanvas</div>
            </div>
            <div id="mobile-mode-indicator">GIST</div>
            <button id="mobile-test-manga-ui-btn" class="mobile-topbar-btn">Test</button>
            <button id="mobile-reset-btn" class="mobile-topbar-btn">Reset</button>
        </div>

        <div class="mobile-mode-row">
            <button id="mobile-chat-mode-btn" class="mobile-mode-btn active">Gist</button>
            <button id="mobile-workshop-mode-btn" class="mobile-mode-btn">Workshop</button>
            <button id="mobile-scene-mode-btn" class="mobile-mode-btn">Production</button>
        </div>

        <div class="workspace-header">
            <div class="workspace-title">Story Feed</div>
            <div class="workspace-sub">Generate manga pages first, then inspect individual panels.</div>
        </div>

        <div id="messages"></div>

        <div class="input-area">
            <div class="composer-mode-row">
                <button id="composer-chat-mode-btn" class="composer-mode-btn active">Gist</button>
                <button id="composer-workshop-mode-btn" class="composer-mode-btn">Workshop</button>
                <button id="composer-scene-mode-btn" class="composer-mode-btn">Production</button>
            </div>
            <div class="composer-shell">
                <input type="file" id="dna-upload" accept="image/*" style="display:none;" />
                <div id="attachment-chip" class="attachment-chip">
                    <img id="attachment-thumb" class="attachment-thumb" />
                    <div class="attachment-copy">
                        <div class="attachment-title">Reference Image</div>
                        <div id="attachment-name" class="attachment-subtitle"></div>
                    </div>
                    <button id="attachment-remove" class="attachment-remove">×</button>
                </div>
                <div class="input-row">
                    <button id="attach-btn" class="attach-btn">+</button>
                    <button id="toggle-tts-btn" class="attach-btn">🔊</button>
                    <div class="text-stack">
                        <input id="user-input" placeholder="Drop an idea..." />
                    </div>
                    <button id="send-btn" class="action-btn">➤</button>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="image-lightbox" class="lightbox">
    <button id="lightbox-close" class="lightbox-close">×</button>
    <button id="lightbox-prev" class="lightbox-nav lightbox-prev">‹</button>
    <img id="lightbox-image" />
    <button id="lightbox-next" class="lightbox-nav lightbox-next">›</button>
    <div id="lightbox-counter" class="lightbox-counter">1 / 1</div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
